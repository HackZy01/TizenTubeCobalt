name: Build Android ARM64 APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-arm64-apk:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      # Standard checkout to pull repository files onto the runner workspace
      - name: Bootstrap Workspace
        uses: actions/checkout@v4

      # Now local actions inside ./actions/ are accessible
      - name: Custom Workspace Setup
        uses: ./actions/checkout

      - name: Authenticate GoB
        uses: ./actions/gob_auth

      - name: Setup Depot Tools & Sync
        uses: ./actions/depot_tools
        with:
          config: config/android-arm64.json

      - name: Build Cobalt ARM64 Target
        uses: ./actions/build
        with:
          config: config/android-arm64.json

      - name: Package APK
        uses: ./actions/package
        with:
          config: config/android-arm64.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-arm64-apk
          path: |
            out/android-arm64*/release/*.apk
            out/android-arm64*/Debug/*.apk
          if-no-files-found: error
