name: Build TizenTube Cobalt APK

on:
  push:
    branches: [ main, master, ytbranding ]
  pull_request:
    branches: [ main, master, ytbranding ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabi libgles2-mesa-dev mesa-common-dev jq ninja-build

      - name: Install Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Gclient Sync (Fetch Toolchains)
        run: |
          cd src
          cp .github/config/android-arm64.json .gclient_config || true
          gclient config --spec 'solutions = [{ "name": "src", "url": "https://github.com/${{ github.repository }}.git", "managed": False, "custom_deps": {}, "custom_vars": { "checkout_android": True }, }]'
          # We only sync toolchains to save time/space
          gclient sync --nohooks --no-history --shallow
          python3 tools/clang/scripts/update.py
          python3 build/android/unbundle/prepare_sdk.py || true
          gclient runhooks

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "cn=Cobalt, ou=Cobalt, o=Cobalt, c=US"

      - name: Generate Build Files (GN)
        run: |
          cd src
          python3 cobalt/build/gn.py -p android-arm64 -c qa --args="sb_is_evergreen_compatible=true"

      - name: Compile (Ninja)
        run: |
          cd src
          # Build crashpad handler then the APK
          ninja -C out/android-arm64_qa native_target/crashpad_handler
          ninja -C out/android-arm64_qa cobalt_apk

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          # Find the generated APK
          find src/out/android-arm64_qa/ -name "*.apk" -exec cp {} artifacts/TizenTube-Cobalt-arm64.apk \;

      - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: TizenTube-Cobalt-APK
            path: artifacts/*.apk
